services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: judgement113322/kittygram_backend:latest
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static:/app/static
      - media:/app/media

  frontend:
    image: judgement113322/kittygram_frontend:latest
    volumes:
      - frontend:/app/result

  gateway:
    image: judgement113322/kittygram_gateway:latest
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - static:/static
      - media:/media
      - frontend:/usr/share/nginx/html
      - ./gateway/default.conf:/etc/nginx/templates/default.conf.template:ro

volumes:
  pg_data:
  static:
  media:
  frontend:
